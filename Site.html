<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized Fullscreen 3x2 Iframe Grid</title>
    <style>
        /* Reset margins to prevent scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Dark background to save screen energy */
            overflow: hidden; /* Prevents scrolling past the viewport */
        }

        /* Container takes up exactly 100% of the viewport width and height */
        .iframe-grid {
            display: grid;
            /* 3 columns taking up 33.33% of the width each */
            grid-template-columns: repeat(3, 33.333vw);
            /* 2 rows taking up 50% of the height each */
            grid-template-rows: repeat(2, 50vh);
            width: 100vw;
            height: 100vh;
        }

        .iframe-grid iframe {
            width: 100%;
            height: 100%;
            border: none; /* Removing borders reduces rendering calculations */
        }
    </style>
</head>
<body>

    <div class="iframe-grid">
        <!-- Row 1 -->
        <iframe src="https://www.governmentjobs.com/jobs?keyword=GIS+Data+Geo+planner+transportation&location=Louisville%2C+KY" title="Iframe 1" loading="lazy" sandbox="allow-scripts allow-same-origin" fetchpriority="low"></iframe>
        <iframe src="https://kypersonnelcabinet.csod.com/ux/ats/careersite/50/home?c=kypersonnelcabinet&sq=Data%20Geo%20planner%20transportation" title="Iframe 2" loading="lazy" sandbox="allow-scripts allow-same-origin" fetchpriority="low"></iframe>
        <iframe src="https://www.apaky.org/jobsrfps" title="Iframe 3" loading="lazy" sandbox="allow-scripts allow-same-origin" fetchpriority="low"></iframe>
        
        <!-- Row 2 -->
        <iframe src="https://www.kipda.org/about/careers/" title="Iframe 4" loading="lazy" sandbox="allow-scripts allow-same-origin" fetchpriority="low"></iframe>
        <iframe src="https://workforindiana.in.gov/search/?searchby=location&createNewAlert=false&q=Data&locationsearch=New+Albany%2C+Clarksville%2C+Jeffersonville&geolocation=&optionsFacetsDD_customfield3=&optionsFacetsDD_city=&optionsFacetsDD_customfield1=" title="Iframe 5" loading="lazy" sandbox="allow-scripts allow-same-origin" fetchpriority="low"></iframe>
        <iframe src="https://www.indeed.com/jobs?q=GIS+Planning&l=Louisville%2C+KY&radius=25&from=searchOnDesktopSerp&vjk=41d8360cc1913819" title="Iframe 6" loading="lazy" sandbox="allow-scripts allow-same-origin" fetchpriority="low"></iframe>
    </div>

</body>
</html>
